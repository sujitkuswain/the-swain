<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Owner Login — The Swain</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
  <style>
    body { background: var(--cream); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card {
      background: #fff;
      border: 1px solid var(--border);
      padding: 48px 40px;
      width: 100%;
      max-width: 380px;
    }
    .login-card__logo {
      font-family: var(--font-serif);
      font-size: 22px;
      letter-spacing: 0.2em;
      color: var(--charcoal);
      text-align: center;
      margin-bottom: 6px;
    }
    .login-card__sub {
      text-align: center;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--stone);
      margin-bottom: 36px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--charcoal);
      outline: none;
      background: var(--warm-white);
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--terracotta); }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: var(--terracotta);
      color: #fff;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .login-btn:hover { background: var(--terracotta-light); }
    .back-link { display: block; text-align: center; margin-top: 20px; font-size: 12px; color: var(--stone); }
    .back-link:hover { color: var(--terracotta); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-card__logo">THE SWAIN</div>
    <div class="login-card__sub">Owner Portal</div>

    <form action="admin-dashboard.html">
      <div class="form-group">
        <label>Username</label>
        <input type="text" placeholder="admin" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" />
      </div>
      <button class="login-btn" type="submit">Sign In</button>
    </form>

    <a class="back-link" href="index.html">← Back to website</a>
  </div>
</body>
</html>
